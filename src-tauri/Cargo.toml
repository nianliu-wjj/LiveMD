[package]
name = "livemd"
version = "1.0.18"
description = "LiveMD, a desktop Markdown editor built with Tauri 2 and Vue 3"
authors = ["nianliu-wjj <fire-phenix@foxmail.com>"]
license = "MIT"
repository = "https://github.com/nianliu-wjj/LiveMD"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "livemd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
tokio = { version = "1", features = ["time", "sync", "fs", "io-util", "rt"] }
# TLS 按平台拆分：Android 走 rustls（native-tls 的 openssl 无法随 NDK 交叉编译），
# 其余平台保持 native-tls（Windows schannel / macOS sectransport）不变
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "charset", "http2"] }
futures-util = "0.3"
fontdb = "0.24"
regex = "1"
url = "2"
percent-encoding = "2"
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }

# 单实例插件仅桌面可用。不要写成 cfg(desktop)：desktop 是 tauri-build 在
# rustc 编译期注入的 cfg，Cargo 依赖解析阶段尚未运行 build script，会求值为 false。
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation", "objc2-core-foundation"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "objc2-app-kit"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "=2.0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_WindowsAndMessaging",
] }
clipboard-win = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
