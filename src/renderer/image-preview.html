<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图片预览</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: rgba(16, 16, 16, 0.96);
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .titlebar {
        width: 100%;
        height: 46px;
        flex: 0 0 46px;
        background: rgba(0, 0, 0, 0.18);
      }
      .viewer {
        width: 100vw;
        height: calc(100vh - 46px);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .viewer.zoomed {
        cursor: grab;
      }
      .viewer.dragging {
        cursor: grabbing;
      }
      img {
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
        -webkit-user-drag: none;
        pointer-events: none;
        transform-origin: center center;
        transition: transform 160ms ease;
      }
      .viewer.dragging img {
        transition: none;
      }
      button {
        position: fixed;
        top: 8px;
        right: 10px;
        z-index: 2;
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 999px;
        color: #fff;
        background: rgba(0, 0, 0, 0.55);
        font-size: 22px;
        line-height: 34px;
        cursor: pointer;
      }
      button:hover {
        background: rgba(0, 0, 0, 0.78);
      }
      .nav-button {
        top: 50%;
        right: auto;
        transform: translateY(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        padding: 0;
        border-radius: 50%;
        opacity: 0.72;
      }
      .nav-button svg {
        width: 24px;
        height: 24px;
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .nav-button:hover {
        opacity: 1;
      }
      .nav-button.prev {
        left: 16px;
      }
      .nav-button.next {
        right: 16px;
      }
      .counter {
        position: fixed;
        left: 50%;
        bottom: 12px;
        z-index: 2;
        transform: translateX(-50%);
        padding: 4px 10px;
        border-radius: 999px;
        color: #fff;
        background: rgba(0, 0, 0, 0.45);
        font:
          12px/1.5 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="titlebar" data-tauri-drag-region></div>
    <button id="close-button" aria-label="关闭" title="关闭">×</button>
    <button
      id="prev-button"
      class="nav-button prev"
      aria-label="上一张"
      title="上一张"
      hidden
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 6 9 12l6 6" />
      </svg>
    </button>
    <button
      id="next-button"
      class="nav-button next"
      aria-label="下一张"
      title="下一张"
      hidden
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m9 6 6 6-6 6" />
      </svg>
    </button>
    <div id="counter" class="counter" hidden></div>
    <div class="viewer" id="viewer">
      <img id="preview-image" />
    </div>
    <script type="module" src="./image-preview.ts"></script>
  </body>
</html>
